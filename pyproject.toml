[project]
name = "bioexplorer"
version = "0.1.0"
description = "CLI-based bioinformatics workbench (sequence-oriented counterpart to ChemExplorer)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.84",
    "click>=8.1",
]

[project.optional-dependencies]
cluster = ["scipy>=1.12", "scikit-learn>=1.4"]
embed = ["umap-learn>=0.5"]
viz = ["matplotlib>=3.8", "cairosvg>=2.7"]
parquet = ["pandas>=2.0", "pyarrow>=14.0"]
dev = ["pytest>=9.1.1"]

[project.scripts]
bio = "bioexplorer.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
